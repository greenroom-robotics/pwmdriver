[workspace]
name = "pwmdriver"
channels = [
  "http://localhost:8000/general",
  "https://prefix.dev/robostack-kilted",
  "https://prefix.dev/conda-forge",
]
platforms = ["linux-64", "linux-aarch64"]
preview = ["pixi-build"]

[dependencies]
pwmdriver = { path = "." }
mise = "*"

[package]
name = "pwmdriver"
version = "1.1.3"
description = "ROS2 Driver for the Linux PWM Interface"
license = "MIT"
authors = ["Russ Webber <russ@rw.id.au>"]

[package.build.backend]
name = "pixi-build-ros-gr"
version = "*"

[package.build.config]
mode = "pixi-native"
build-type = "ament_cmake"
distro = "kilted"

build-number = 1
[package.host-dependencies]
ros-kilted-ament-cmake = "*"
ros-kilted-rclcpp = "*"
ros-kilted-std-msgs = "*"
fmt = "*"

[package.run-dependencies]
ros-kilted-rclcpp = "*"
ros-kilted-std-msgs = "*"
fmt = "*"
