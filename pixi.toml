[workspace]
name = "pwmdriver"
channels = [
  "az://stgrcondachannel.blob.core.windows.net/general",
  "https://prefix.dev/robostack-kilted",
  "https://prefix.dev/conda-forge",
]
platforms = ["linux-64", "linux-aarch64"]
preview = ["pixi-build"]

[package]
name = "pwmdriver"
version = "1.1.3"
description = "ROS2 Driver for the Linux PWM Interface"
license = "MIT"
authors = ["Russ Webber <russ@rw.id.au>"]

[dependencies.pwmdriver]
path   = "."
extras = ["test"]

[package.build.backend]
name = "pixi-build-ros-gr"
version = ">=0.5,<0.6"

[package.build.config]
mode = "pixi-native"
build-type = "ament_cmake"
distro = "kilted"
build-number = 1

[package.host-dependencies]
ros-kilted-ament-cmake = "*"
ros-kilted-rclcpp = "*"
ros-kilted-std-msgs = "*"
fmt = "*"

[package.run-dependencies]
ros-kilted-rclcpp = "*"
ros-kilted-std-msgs = "*"
fmt = "*"

[package.extra-dependencies.test]
ros-dev-tools-meta = "*"
fmt = "*"
ros-kilted-ament-lint-auto = "*"

[tasks]
build = "colcon build --packages-select pwmdriver --symlink-install"

[tasks.colcon-test]
cmd        = "bash -c 'colcon test --packages-select pwmdriver --retest-until-pass 3 --event-handlers console_direct+ || [ $? -eq 5 ]'"
depends-on = ["build"]

[tasks.test]
cmd        = "colcon test-result --all --verbose"
depends-on = ["colcon-test"]
